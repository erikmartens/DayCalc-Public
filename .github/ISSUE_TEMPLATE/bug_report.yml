name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve DayCalc. Issues are public. Remove personal calendar data, contact information, and other sensitive content before submitting.
  - type: input
    id: app_version
    attributes:
      label: DayCalc version
      description: Copy the version and build from Settings → About.
      placeholder: "3.0 (123)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and iOS version
      placeholder: "iPhone 15 Pro, iOS 18.5"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Calendar
        - Deadlines and notifications
        - Calculations
        - Settings, appearance, or language
        - About, legal, or support
        - Migration or launch
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal calendar data, credentials, contact information, and other sensitive content.
          required: true
        - label: I searched existing public issues for this behavior.
          required: true

